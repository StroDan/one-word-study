<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Word Study</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2f5fd0; --card: #fff;
            --good: #1f7a3f; --bad: #b3261e; --line: #deded8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #181816; --fg: #ececea; --muted: #a3a39d; --accent: #8aa9ff; --card: #23231f;
              --good: #6fd28f; --bad: #ff8a80; --line: #3a3a35; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 16px;
             align-items: baseline; flex-wrap: wrap; }
    header strong { font-size: 18px; margin-right: auto; }
    a { color: var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    .message { border-left: 4px solid var(--bad); background: var(--card); padding: 12px 16px; }
    button, input[type=submit] { font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
             border: 1px solid var(--accent); background: var(--accent); color: var(--bg); }
    input[type=text] { font: inherit; padding: 8px; width: 100%; border: 1px solid var(--line);
             border-radius: 6px; background: var(--card); color: var(--fg); }
    .muted { color: var(--muted); }
    .good { color: var(--good); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .flash { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
             min-height: 120px; text-align: left; color: var(--fg); font-weight: normal; width: 100%; }
    .flash .back { display: none; }
    .flash.flipped .front { display: none; }
    .flash.flipped .back { display: block; }
    .flash .front { font-size: 20px; font-weight: 600; }
    .definition { font-size: 20px; background: var(--card); border: 1px solid var(--line);
                  border-radius: 10px; padding: 16px; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <strong>One Word Study</strong>
    <a href="/">Upload</a>
    <a href="/cards">Cards</a>
    <a href="/quiz">Quiz</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
